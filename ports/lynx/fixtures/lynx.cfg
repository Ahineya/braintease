# Small guest browser defaults, read by the actual guest.
STARTFILE:file:///mnt/host/local.html
DEFAULT_CHARSET:iso-8859-1
CHARACTER_SET:us-ascii

# Keep memory and stalled connections bounded on C16 targets.
DEFAULT_CACHE_SIZE:2
CONNECT_TIMEOUT:15
READ_TIMEOUT:15
MAX_URI_SIZE:2048
SET_COOKIES:FALSE
