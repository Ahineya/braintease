[workspace]
members = [
    "rcc-codegen",
    "rcc-common",
    "rcc-backend",
    "rcc-driver",
    "rcc-frontend",
    "rcc-test",
    "rvm", "rcc-preprocessor",
    "rbf",
]
exclude = [
    'src/rust-bf',
    'src/ripple-asm',
    'src/bf-macro-expander',
    'rbt'
]


resolver = "2"

[workspace.dependencies]
# Common dependencies that all crates might use
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"
env_logger = "0.11"
rcc-common = { path = "rcc-common" }
rcc-frontend = { path = "rcc-frontend" }

[workspace.lints.rust]
warnings = "deny"

# Profiles in dependency manifests do not apply to workspace binaries such as
# rbf. Optimize across crate boundaries here, including its BF engine dependency.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
