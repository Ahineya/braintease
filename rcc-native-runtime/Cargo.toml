[package]
name = "rcc-native-runtime"
version = "0.1.0"
edition = "2021"
[lib]
crate-type = ["staticlib", "rlib"]
[features]
host-tui = []
[build-dependencies]
cc = "1"
[dependencies]
rcc-ir.workspace = true
rvm = { path = "../rvm" }
serde_json.workspace = true
libloading = "0.8.8"
libc = "0.2"
pixels = "0.12"
winit = "0.28"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[lints]
workspace = true
