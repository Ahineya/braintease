[package]
name = "rvm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rvm"
path = "src/lib.rs"
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "rvm"
path = "src/main.rs"

[dependencies]
ripple-asm = { path = "../src/ripple-asm" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
libc = "0.2"
getrandom = "0.3.3"
p256 = { version = "0.13", features = ["ecdh", "ecdsa"] }
p384 = { version = "0.13", features = ["ecdh", "ecdsa"] }
p521 = { version = "0.13", features = ["ecdh", "ecdsa"] }
num-bigint = "0.4"
crypto-bigint = { version = "0.5.5", features = ["zeroize"] }
hmac = "0.12"
aes = { version = "0.8", features = ["zeroize"] }
aes-gcm = { version = "0.10", features = ["zeroize"] }
zeroize = "1"
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
ratatui = "0.26"
crossterm = "0.27"
tui-textarea = "0.4"
signal-hook = "0.3"
pixels = "0.12"
png = "0.17"
winit = "0.28"
cranelift-codegen = "=0.137.0-rc.1"
cranelift-frontend = "=0.137.0-rc.1"
cranelift-jit = "=0.137.0-rc.1"
cranelift-module = "=0.137.0-rc.1"
cpal = "0.18"
nuked-opl3 = "=0.1.0"

[lints]
workspace = true
