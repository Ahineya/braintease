[package]
name = "rvm"
version = "0.1.0"
edition = "2021"

[lib]
name = "rvm"
path = "src/lib.rs"

[[bin]]
name = "rvm"
path = "src/main.rs"

[dependencies]
ripple-asm = { path = "../src/ripple-asm" }
clap = { version = "4.5", features = ["derive"] }
colored = "2.1"
ratatui = "0.26"
crossterm = "0.27"
tui-textarea = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
signal-hook = "0.3"
pixels = "0.12"
png = "0.17"
sha2 = "0.10"
winit = "0.28"
log = { workspace = true }
cranelift-codegen = "=0.137.0-rc.1"
cranelift-frontend = "=0.137.0-rc.1"
cranelift-jit = "=0.137.0-rc.1"
cranelift-module = "=0.137.0-rc.1"

[lints]
workspace = true
