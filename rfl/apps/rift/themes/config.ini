; System settings. User layer: $HOME/.config/rift/config.ini.
[editor]
tabstop = 4
expandtab = true
autoindent = true
numbers = true

; Commands run in the file's directory using the guest shell.
; {file}, {dir}, {tool}, {output} are individually shell-quoted.
; {output} reserves a private /tmp directory, cleaned after execution.
; Unset entries use detected guest tools and BF/TCLSH/AWK/SHELL/etc.
; Override one runner through RIFT_RUN_brainfuck, for example.
[run]
; brainfuck = {tool} {file}
; tcl = {tool} {file}
; c = {tool} {file} -o {output} && {output}
; rfl = rfl run {file}
