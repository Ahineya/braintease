; Muted classic Turbo-style palette: ordinary blue, never bright-blue background.
[theme]
name = Turbo Blue
borders = line
[colors]
text = white, blue
comment = cyan, blue
keyword = yellow, blue, bold
string = cyan, blue, bold
number = yellow, blue
operator = white, blue, bold
type = cyan, blue, bold
selection = black, cyan
menu = black, white
tab = black, cyan, bold
gutter = cyan, blue
dialog = black, white
accent = yellow, blue, bold
input = white, blue
error = white, red, bold
shadow = black, black
