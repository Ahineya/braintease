; Classic Midnight Commander colors without bright-blue backgrounds.
[theme]
name = Classic Blue
borders = line

; foreground, background, optional bold/reverse/underline
[colors]
text = white, blue
frame = cyan, blue
title = white, blue, bold
selected = black, cyan
inactive = white, black
status = white, black
error = white, red
directory = cyan, blue, bold
dialog = black, white
input = white, blue
accent = yellow, black
muted = cyan, blue
shadow = black, black
