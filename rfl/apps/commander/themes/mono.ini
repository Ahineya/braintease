; A complete theme without inheritance or color-dependent selection.
[theme]
name = Monochrome
borders = ascii

[colors]
text = default, default
frame = default, default
title = default, default, bold
selected = default, default, reverse
inactive = default, default, underline
status = default, default, reverse
error = default, default, bold
directory = default, default, bold
dialog = default, default, reverse
input = default, default
accent = default, default, bold
muted = default, default
shadow = default, default
