[package]
name = "rfl"
version = "0.1.0"
edition = "2021"
description = "Ripple Functional Language compiler"

[[bin]]
name = "rfl"
path = "src/main.rs"

[dependencies]
rcc-backend = { path = "../rcc-backend" }
rcc-codegen = { path = "../rcc-codegen" }
rcc-ir = { workspace = true }
clap = { version = "4.5", features = ["derive"] }

[lints]
workspace = true
