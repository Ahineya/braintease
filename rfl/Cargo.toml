[package]
name = "rfl"
version = "0.1.0"
edition = "2021"
description = "Ripple Functional Language compiler"

[[bin]]
name = "rfl"
path = "src/main.rs"

[dependencies]
rcc-backend = { path = "../rcc-backend" }
rcc-native = { path = "../rcc-native" }
rcc-wasm = { path = "../rcc-wasm" }
rcc-codegen = { path = "../rcc-codegen" }
rcc-frontend = { path = "../rcc-frontend" }
rcc-ir = { workspace = true }
rcc-preprocessor = { path = "../rcc-preprocessor" }
clap = { version = "4.5", features = ["derive"] }
serde_json = { workspace = true }

[lints]
workspace = true

[dev-dependencies]
wasmparser = { version = "0.240", default-features = false, features = ["std", "validate", "features"] }
